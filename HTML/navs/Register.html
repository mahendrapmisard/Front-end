  <body>
    <h1>this is Register page</h1>

    <form class="register-form">
      <div>
        <label for="fullname">Full Name : </label>
        <input id="fullname" type="textbox" />
      </div>

      <div>
        <label for="Dob">Date of birth : </label>
        <input id="dob" type="date" />
      </div>

      <div>
        <label for="playertype">Kind of player : </label>
        <select>
          <option>batter</option>
          <option>bowler</option>
          <option>batting allrounder</option>
          <option>bowling allrounder</option>
          <option>wicket keeper batter</option>
        </select>
      </div>
      <div>
        <label for="gender">Gender : </label>
        <input type="radio" name="gender" />Male
        <input type="radio" name="gender" />female
      </div>

      <div>
        <label for="captain">Personal kit belongings</label>
        <input type="checkbox" /> Bat <input type="checkbox" /> Ball
        <input type="checkbox" /> Helmet <input type="checkbox" /> Pads
      </div>
      <div>
        <label for="acheviments"
          >Mention about your achivements and records :
        </label>
        <textarea rows="5"></textarea>
      </div>
      <div>
        <label for=" submit">click on submit to application : </label>
        <button>Submit</button>
      </div>
    </form>
  </body>
</html>
